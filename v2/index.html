<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЛузБет 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{color-scheme:dark;--g:#d8b25c;--p:#15130f}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f1e8;font-family:Inter,system-ui}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid #292318}.logo{font-weight:900;letter-spacing:.12em;font-size:22px}.logo b{color:var(--g)}main{max-width:1050px;margin:auto;padding:55px 24px}.panel{background:linear-gradient(145deg,#17140e,#0e0e0e);border:1px solid #30291b;border-radius:22px;padding:28px}.auth{max-width:440px;margin:50px auto}h1{font-size:48px;margin:0 0 8px}.muted{color:#999}input,button{width:100%;padding:14px 15px;border-radius:11px;border:1px solid #393226;background:#0d0d0d;color:white;margin-top:10px;font-size:15px}button{background:var(--g);color:#161109;border:0;font-weight:900;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.balance{font-size:24px;color:var(--g);font-weight:900}.wheel{width:230px;height:230px;margin:28px auto;border-radius:50%;border:10px solid #b99245;background:conic-gradient(#8f1720 0 10deg,#111 10deg 20deg,#8f1720 20deg 30deg,#111 30deg 40deg,#8f1720 40deg 50deg,#111 50deg 60deg,#8f1720 60deg 70deg,#111 70deg 80deg,#8f1720 80deg 90deg,#111 90deg 100deg,#8f1720 100deg 110deg,#111 110deg 120deg,#8f1720 120deg 130deg,#111 130deg 140deg,#8f1720 140deg 150deg,#111 150deg 160deg,#8f1720 160deg 170deg,#111 170deg 180deg,#8f1720 180deg 190deg,#111 190deg 200deg,#8f1720 200deg 210deg,#111 210deg 220deg,#8f1720 220deg 230deg,#111 230deg 240deg,#8f1720 240deg 250deg,#111 250deg 260deg,#8f1720 260deg 270deg,#111 270deg 280deg,#8f1720 280deg 290deg,#111 290deg 300deg,#8f1720 300deg 310deg,#111 310deg 320deg,#8f1720 320deg 330deg,#111 330deg 340deg,#8f1720 340deg 350deg,#075c31 350deg)}.wheel div{height:100%;display:grid;place-items:center;font-size:52px;font-weight:900;text-shadow:0 3px 12px #000}.bets{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.n{margin:0;padding:10px;background:#171717}.n.sel{outline:2px solid var(--g);color:var(--g)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.msg{text-align:center;min-height:26px;color:#d8b25c;font-weight:700}@media(max-width:600px){.bets{grid-template-columns:repeat(4,1fr)}h1{font-size:36px}}.nav{display:flex;gap:8px;margin-bottom:18px}.nav button{width:auto;margin:0;background:#171717;color:#aaa}.nav button.active{background:#d8b25c;color:#161109}.view[hidden]{display:none}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.game{min-height:145px;text-align:left;background:linear-gradient(145deg,#19160f,#101010);border:1px solid #30291b}.game strong{display:block;font-size:22px;margin-bottom:8px}.game.live{border-color:#8a6a2d}.history{width:100%;border-collapse:collapse}.history td,.history th{padding:12px 8px;border-bottom:1px solid #29251d;text-align:left}.win{color:#65d48a}.loss{color:#aaa}@media(max-width:650px){.games{grid-template-columns:1fr 1fr}.history{font-size:12px}}</style></head>
<body><header><div class="logo">ЛУЗ<b>БЕТ</b> <small>2.0</small></div><div id="user"></div></header><main>
<section id="auth" class="panel auth"><h1>Вход</h1><p class="muted">Новая версия ЛузБета. Аккаунты теперь настоящие, а не код в localStorage.</p><input id="username" autocomplete="username" placeholder="Логин"><input id="password" type="password" placeholder="Пароль"><button onclick="login()">ВОЙТИ</button><p id="authmsg" class="msg"></p></section>
<section id="casino" hidden><div class="top"><div><div class="muted">ВАШ БАЛАНС</div><div class="balance"><span id="balance">—</span> LK</div></div><button style="width:auto;padding:10px 16px;background:#24211b;color:#ddd" onclick="logout()">Выйти</button></div>
<div class="nav"><button id="navLobby" class="active" onclick="showView('lobby')">Лобби</button><button id="navRoulette" onclick="showView('roulette')">Рулетка</button><button id="navHistory" onclick="showView('history')">История</button><button id="navAdmin" hidden onclick="showView('admin')">Админ</button></div><div id="lobby" class="view"><div class="games"><button class="game live" onclick="showView('roulette')"><strong>Roulette</strong><span>ИГРАТЬ · LIVE</span></button><button class="game"><strong>Blackjack</strong><span class="muted">СКОРО</span></button><button class="game"><strong>Businka Slots</strong><span class="muted">СКОРО</span></button><button class="game"><strong>Crash</strong><span class="muted">СКОРО</span></button><button class="game"><strong>Mines</strong><span class="muted">СКОРО</span></button><button class="game"><strong>Plinko</strong><span class="muted">СКОРО</span></button></div></div><div id="roulette" class="view panel" hidden><div class="muted">EUROPEAN ROULETTE · STRAIGHT UP v1</div><div class="wheel"><div id="result">?</div></div><p id="msg" class="msg">Выберите число от 0 до 36</p><div id="numbers" class="bets"></div><div class="row"><input id="bet" type="number" min="1" max="7500" value="10"><button id="play" onclick="play()">КРУТИТЬ</button></div></div><div id="history" class="view panel" hidden><div class="muted">ПОСЛЕДНИЕ РАУНДЫ</div><table class="history"><thead><tr><th>Время</th><th>Ставка</th><th>Выплата</th></tr></thead><tbody id="historyBody"></tbody></table></div><div id="admin" class="view panel" hidden><div class="muted">УПРАВЛЕНИЕ ИГРОКАМИ</div><h2>Создать игрока</h2><div class="row"><input id="newUsername" placeholder="Логин: dima"><input id="newDisplayName" placeholder="Имя: Дима"></div><input id="newPassword" type="password" placeholder="Пароль (минимум 8 символов)"><button onclick="createPlayer()">СОЗДАТЬ ИГРОКА</button><p id="adminMsg" class="msg"></p></div></section>
</main><script>
const URL="https://kdsowktuirtkxnmtyoaz.supabase.co",KEY="sb_publishable_zjMkZslnb71eXQ_q6FQIAQ_eGyoW82B";
const sb=supabase.createClient(URL,KEY);let selected=null;
const nums=document.getElementById("numbers");for(let i=0;i<=36;i++){const b=document.createElement("button");b.className="n";b.textContent=i;b.onclick=()=>{selected=i;document.querySelectorAll(".n").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");document.getElementById("msg").textContent="Ставка на "+i};nums.appendChild(b)}
async function login(){authmsg.textContent="";const r=await fetch(URL+"/functions/v1/v2-login",{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok){authmsg.textContent="Неверный логин или пароль";return}const {error}=await sb.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token});if(error){authmsg.textContent="Не удалось открыть сессию";return}boot()}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){const {data:{user:u}}=await sb.auth.getUser();if(!u)return;auth.hidden=true;casino.hidden=false;const {data:p}=await sb.from("profiles").select("display_name,username,role").single();user.textContent=p?.display_name||p?.username||"Игрок";if(["admin","owner"].includes(p?.role))navAdmin.hidden=false;await refresh();showView("lobby")}
async function refresh(){const {data}=await sb.from("wallets").select("balance").single();if(data)balance.textContent=data.balance.toLocaleString("ru-RU")}
async function loadHistory(){const {data}=await sb.from("casino_rounds").select("bet,payout,status,created_at").order("created_at",{ascending:false}).limit(20);historyBody.innerHTML=(data||[]).map(r=>'<tr><td>'+new Date(r.created_at).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+'</td><td>'+r.bet+' LK</td><td class="'+(r.payout>0?'win':'loss')+'">'+r.payout+' LK</td></tr>').join("")||'<tr><td colspan="3" class="muted">Раундов пока нет</td></tr>'}
function showView(name){["lobby","roulette","history","admin"].forEach(x=>document.getElementById(x).hidden=x!==name);["Lobby","Roulette","History","Admin"].forEach(x=>{const e=document.getElementById("nav"+x);if(e)e.classList.toggle("active",x.toLowerCase()===name)});if(name==="history")loadHistory()}
async function createPlayer(){adminMsg.textContent="Создаю…";const {data,error}=await sb.functions.invoke("v2-admin-create-player",{body:{username:newUsername.value,displayName:newDisplayName.value,password:newPassword.value}});if(error){adminMsg.textContent="Не удалось создать игрока";return}adminMsg.textContent="Игрок "+data.username+" создан. Стартовый баланс: 1 000 LK";newUsername.value="";newDisplayName.value="";newPassword.value=""}
async function play(){if(selected===null){msg.textContent="Сначала выберите число";return}const amount=Number(bet.value);play.disabled=true;msg.textContent="Крупье подозрительно улыбается…";result.textContent="…";const {data,error}=await sb.functions.invoke("v2-play-roulette",{body:{bet:amount,selectedNumber:selected,idempotencyKey:crypto.randomUUID(),clientSeed:crypto.randomUUID()}});if(error){msg.textContent="Ошибка ставки";console.error(error)}else{result.textContent=data.winningNumber;msg.textContent=data.win?"ВЫИГРЫШ! +"+data.round.payout+" LK":"Выпало "+data.winningNumber+". Финансовое решение принято.";await refresh();await loadHistory()}play.disabled=false}
sb.auth.onAuthStateChange(()=>boot());boot();
</script></body></html>
