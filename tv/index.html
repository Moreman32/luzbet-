<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LuzBet TV</title><style>
*{box-sizing:border-box}body{margin:0;background:#08101c;color:#f5f4ef;font:clamp(16px,1.5vw,32px)/1.4 system-ui,sans-serif}main{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:2vh;padding:3vh 3vw;background:radial-gradient(ellipse at 75% 20%,#243b59,transparent 65%)}header,footer{display:flex;align-items:center;gap:1rem}header{border-bottom:1px solid #476078;padding-bottom:1vh}.logo{font-weight:950;font-size:2em;letter-spacing:-.08em;color:#ffd481}.tag{font-size:.65em;letter-spacing:.18em;text-transform:uppercase;color:#b5c6da}.clock{margin-left:auto;font-variant-numeric:tabular-nums}button{background:#20344b;color:white;border:1px solid #506881;border-radius:8px;padding:.5em .8em;font:inherit;font-size:.65em;cursor:pointer}button:focus-visible{outline:3px solid #ffd481}.studio{display:grid;grid-template-columns:1fr 1.6fr;gap:3vw;align-items:center}.host{min-height:48vh;display:grid;place-items:center;position:relative;border:1px solid #425a75;border-radius:20px;background:linear-gradient(145deg,#294763,#111d31);overflow:hidden}.host img{width:100%;height:48vh;object-fit:contain;position:absolute;inset:0}.placeholder{font-size:6em}.host small{position:absolute;bottom:0;background:#111d31;padding:.5em 1em;width:100%;text-align:center;font-size:.65em}.story{max-width:42em}h1{font-size:clamp(32px,4vw,90px);line-height:1.06;margin:.25em 0;color:#ffd481;letter-spacing:-.04em}p{font-size:1.05em;line-height:1.5}.kicker{letter-spacing:.15em;color:#92b7dc;font-size:.65em;font-weight:700}.note{font-size:.6em;color:#b5c6da}footer{background:#ffd481;color:#101a2b;padding:.7em 1em;border-radius:6px;font-weight:750;font-size:.8em;min-height:3em}footer span{flex:1}.controls{display:flex;gap:.4em;flex-wrap:wrap}dialog{max-width:min(90vw,1000px);background:#16263b;color:white;border:1px solid #506881;border-radius:14px;padding:1.5rem}dialog::backdrop{background:#000b}li{margin-bottom:1em}@media(max-width:700px){.studio{grid-template-columns:1fr}.host{min-height:25vh}.host img{height:25vh}.placeholder{font-size:3em}header{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body:not(.preview) .controls,body:not(.preview) #status{display:none}body:not(.preview){cursor:none}[hidden]{display:none!important}
</style></head><body><main><header><div class="logo">LUZBET TV</div><div class="tag">Редакция абсурда<br>Демонстрационный эфир</div><div class="clock" id="clock"></div><div class="controls"><button id="pause">Пауза</button><button id="next">Следующая</button><button id="archive">Архив</button><button id="full">На весь экран</button></div></header><section class="studio"><div class="host"><div class="placeholder" id="placeholder">🎙️</div><img id="portrait" hidden alt="Ведущий"><small>Главный редактор • LuzBet TV</small></div><article class="story"><div class="kicker" id="category"></div><h1 id="headline"></h1><p id="body"></p><div class="note" id="status"></div></article></section><footer><b>ИЗ РЕДАКЦИИ</b><span id="ticker"></span></footer></main><dialog id="history"><h2>Архив демонстрационных выпусков</h2><ol id="articles"></ol><button id="close">Закрыть</button></dialog><script type="module">
if(new URLSearchParams(location.search).get('preview')==='1')document.body.classList.add('preview');
const stories=[
{category:'УТРЕННЯЯ СВОДКА',headline:'Бухгалтерия нашла арифметику',body:'Сотрудники обнаружили арифметику в старом шкафу. Руководство распорядилось не трогать находку до завершения инвентаризации. Бусинка назначена председателем комиссии.',pose:'desk'},
{category:'ОБЗОР ПРЕССЫ',headline:'Калькулятор отказался давать интервью',body:'Представитель калькулятора сообщил, что устройство переживает творческий кризис. Редакция уважает его решение и временно перешла на счёты.',pose:'newspaper'},
{category:'НАУКА',headline:'НИИ дисперсии открыл понедельник',body:'После продолжительного исследования специалисты подтвердили, что понедельник наступает даже без согласования с бухгалтерией. Доклад отправлен на доработку.',pose:'analyst'},
{category:'РЕКЛАМНАЯ ПАУЗА',headline:'Премиальная тишина',body:'Новый продукт LuzBet — абсолютно ничего в подарочной упаковке. Теперь доступен без подписки, регистрации и совещания по внедрению.',pose:'desk'},
{category:'ВЕЧЕРНИЙ ОБЗОР',headline:'Бусинка одобрила перерыв',body:'Совет директоров единогласно проголосовал за перерыв. Президент уснула на протоколе, поэтому решение считается подписанным.',pose:'coffee'}];
const $=id=>document.getElementById(id);let index=0,paused=false,remaining=480,frames={},speakingUntil=0;
try{const res=await fetch('./host.json',{cache:'no-cache'});if(res.ok)frames=await res.json()}catch{}
function render(){const s=stories[index];$('category').textContent=s.category;$('headline').textContent=s.headline;$('body').textContent=s.body;$('ticker').textContent=s.headline+' • Вымышленная сатира';remaining=480;speakingUntil=Date.now()+Math.max(45000,s.body.split(/\s+/).length*600);const pair=frames[s.pose];$('portrait').hidden=!pair?.idle;$('placeholder').hidden=!!pair?.idle;if(pair?.idle)$('portrait').src=pair.idle}
function next(){index=(index+1)%stories.length;render()}
$('next').onclick=next;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Продолжить':'Пауза'};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};
for(const s of stories){const li=document.createElement('li');const strong=document.createElement('strong');strong.textContent=s.headline;li.append(strong,document.createElement('br'),document.createTextNode(s.body));$('articles').append(li)}
$('archive').onclick=()=>$('history').showModal();$('close').onclick=()=>$('history').close();
setInterval(()=>{const now=new Date();$('clock').textContent=new Intl.DateTimeFormat('ru-RU',{timeZone:'Asia/Nicosia',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(now);if(!paused&&!$('history').open&&--remaining<=0)next();$('status').textContent=(paused?'Пауза • ':'Следующая передача через '+Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')+' • ')+'Сатирический демонстрационный контент'},1000);
setInterval(()=>{const pair=frames[stories[index].pose];if(pair?.idle){const talk=!paused&&!$('history').open&&Date.now()<speakingUntil&&Math.floor(Date.now()/300)%2===0;const src=talk&&pair.talk?pair.talk:pair.idle;if($('portrait').getAttribute('src')!==src)$('portrait').src=src}},300);render();
</script></body></html>
